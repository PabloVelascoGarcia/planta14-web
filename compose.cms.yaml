name: planta14-v2-development
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: planta14
      POSTGRES_USER: planta14
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planta14 -d planta14"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
