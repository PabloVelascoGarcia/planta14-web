# Integración continua de Planta 14. Solo comprueba: no publica imágenes ni despliega nada y no usa secretos.
name: CI

on:
  push:
    branches: ["desarrollo/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  app:
    name: Tests, tipos, lint y build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      # CMS desactivado en el build, igual que en infra/app.Dockerfile: no necesita base de datos ni secretos.
      - run: npm run build
        env:
          CMS_ENABLED: "false"
      - name: ShellCheck de infra/
        run: shellcheck -x infra/generate-env.sh infra/lib/*.sh infra/backup/*.sh infra/restore/*.sh infra/minio/*.sh infra/postgres/*.sh infra/postgres/initdb/*.sh infra/monitor/*.sh infra/test/*.sh

  image:
    name: Imagen de la app (sin publicar)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/app.Dockerfile
          push: false
          load: false
          tags: planta14-app:ci
