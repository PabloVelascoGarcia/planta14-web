# Inicios de sesión fallidos en Payload (/cms y paneles municipales), desde el registro JSON de Caddy.
# Payload responde 401 a una contraseña incorrecta y 403/429 a una cuenta bloqueada.
[Definition]
failregex = ^\{.*"client_ip":"<HOST>".*"method":"POST".*"uri":"/api/cms/users/login(?:\?[^"]*)?".*"status":(?:401|403|429)[,}]
ignoreregex =
datepattern = "ts":{EPOCH}
