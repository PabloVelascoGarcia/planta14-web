# Planta 14: SSH solo con clave, sin root. Se llama 00-… para que se aplique antes que
# 50-cloud-init.conf (en sshd gana el primer valor leído).
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowUsers __ADMIN_USER__
