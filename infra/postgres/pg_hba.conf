# Acceso a PostgreSQL de Planta 14 (se carga con: postgres -c hba_file=/planta14/pg_hba.conf).
# Defensa en profundidad, además del aislamiento de redes de Docker:
#  - socket local (docker exec: copias, restauraciones, administración): como en la imagen oficial;
#  - TCP solo desde la red a la que está conectado el contenedor ("samenet" = la red interna backend)
#    y siempre con contraseña SCRAM. Cualquier otra red (por ejemplo la de salida de las copias) se rechaza
#    aunque llegara a alcanzar la IP del contenedor.
# TYPE  DATABASE  USER  ADDRESS   METHOD
local   all       all             trust
host    all       all   127.0.0.1/32  scram-sha-256
host    all       all   ::1/128   scram-sha-256
host    all       all   samenet   scram-sha-256
