name: planta14-bloque3-test
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: planta14_bloque3_test
      POSTGRES_USER: planta14
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:55434:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planta14 -d planta14_bloque3_test"]
      interval: 2s
      timeout: 5s
      retries: 20
